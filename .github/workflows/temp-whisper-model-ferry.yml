name: Temporary Whisper model ferry

on:
  push:
    paths:
      - '.github/workflows/temp-whisper-model-ferry.yml'
  pull_request:
    paths:
      - 'temp-trigger.txt'
  workflow_dispatch:

jobs:
  download-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download public Whisper small.en q5_1 model
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin' \
            -o ggml-small.en-q5_1.bin
          stat -c '%n %s bytes' ggml-small.en-q5_1.bin
          sha256sum ggml-small.en-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-en-q5_1
          path: ggml-small.en-q5_1.bin
          compression-level: 0
          retention-days: 1
