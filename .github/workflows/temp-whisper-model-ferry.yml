name: Temporary Whisper model ferry

on:
  push:
    paths:
      - '.github/workflows/temp-whisper-model-ferry.yml'
  pull_request:
    paths:
      - 'temp-trigger.txt'
  workflow_dispatch:

jobs:
  download-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download public Whisper large-v3-turbo q5_0 model
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin' \
            -o ggml-large-v3-turbo-q5_0.bin
          stat -c '%n %s bytes' ggml-large-v3-turbo-q5_0.bin
          sha256sum ggml-large-v3-turbo-q5_0.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-v3-turbo-q5_0
          path: ggml-large-v3-turbo-q5_0.bin
          compression-level: 0
          retention-days: 1
